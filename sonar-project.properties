# Configuración de SonarQube para Proyecto Flutter
sonar.projectKey=acees-group
sonar.projectName=ACEES Group - Sistema de Control de Acceso
sonar.projectVersion=1.0.0

# Información del proyecto
sonar.organization=acees-group
sonar.projectDescription=Sistema de control de acceso desarrollado en Flutter con Firebase

# Configuración de código fuente
sonar.sources=lib
sonar.tests=test
sonar.language=dart

# Configuración de archivos
sonar.sourceEncoding=UTF-8

# Exclusiones de análisis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,**/generated/**,**/build/**,**/android/**,**/ios/**,**/web/**,**/windows/**,**/linux/**,**/macos/**,**/firebase_options.dart

# Exclusiones de cobertura
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,**/generated/**,**/main.dart,**/firebase_options.dart

# Configuración de cobertura de código
sonar.dart.coverage.reportPaths=coverage/lcov.info

# Configuración de duplicación de código
sonar.cpd.exclusions=**/*.g.dart,**/*.freezed.dart

# Para SonarCloud (comentar si usas SonarQube local)
sonar.host.url=https://sonarcloud.io

# Configuración adicional de Dart
sonar.dart.analysis.reportPaths=dart_analysis_report.json

# Configuración de métricas
sonar.dart.analysis.timeout=60

# Patrones de archivos a incluir en el análisis
sonar.inclusions=**/*.dart

# Configuración Quality Gate personalizada
sonar.qualitygate.wait=true

# Configuración de new code (solo analizar código nuevo en PRs)
sonar.newCode.referenceBranch=main