name: Flutter CI with SonarCloud

on:
  push:
    branches: [ main, develop, Arce ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze project source
      run: |
        flutter analyze > flutter_analyze_report.txt || true
        flutter analyze --write=dart_analysis_report.json --format=json || true

    - name: Run tests
      run: |
        flutter test --coverage --reporter json > test_report.json || true

    - name: Run SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}